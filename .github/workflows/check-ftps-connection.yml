name: Check FTPS connection (read only)

on:
  push:
    branches: [codex/ftps-connection-check]
    paths: [.github/workflows/check-ftps-connection.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-7of10-ftps
  cancel-in-progress: false

jobs:
  check:
    name: Verify TLS, login, and directory access
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ftps-connection-check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: FTP
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_PORT: ${{ vars.FTP_PORT }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_REMOTE_ROOT: ${{ vars.FTP_REMOTE_ROOT }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Connect without uploading or changing files
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import posixpath
          import ssl
          import sys
          import urllib.request

          required = ('FTP_HOST', 'FTP_PORT', 'FTP_USER', 'FTP_REMOTE_ROOT', 'FTP_PASSWORD')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit('Missing settings: ' + ', '.join(missing))
          if os.environ['FTP_PORT'] != '21':
              sys.exit('Expected explicit FTPS on port 21.')
          stage = 'TLS connection'
          context = ssl.create_default_context()
          # The hosting server omits this intermediate. Keep the system roots
          # and hostname verification; do not enable partial-chain trust.
          context.verify_flags &= ~ssl.VERIFY_X509_PARTIAL_CHAIN
          issuer_url = 'https://secure.globalsign.com/cacert/gsgccr6alphasslca2025.crt'
          with urllib.request.urlopen(issuer_url, timeout=20) as response:
              intermediate = response.read()
          context.load_verify_locations(cadata=ssl.DER_cert_to_PEM_cert(intermediate))
          ftp = ftplib.FTP_TLS(context=context, timeout=20)
          try:
              ftp.connect(os.environ['FTP_HOST'], 21)
              ftp.auth()
              print('PASS: certificate chain and hostname verified.', flush=True)
              stage = 'authentication'
              ftp.login(os.environ['FTP_USER'], os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              print('PASS: authentication and encrypted data channel.', flush=True)
              print('Login directory: ' + ftp.pwd(), flush=True)
              stage = 'target directory access'
              try:
                  ftp.cwd(os.environ['FTP_REMOTE_ROOT'])
              except ftplib.error_perm:
                  parent = posixpath.dirname(os.environ['FTP_REMOTE_ROOT'].rstrip('/')) or '/'
                  ftp.cwd(parent)
                  entries = ftp.nlst()
                  child = posixpath.basename(os.environ['FTP_REMOTE_ROOT'].rstrip('/'))
                  exists = any(posixpath.basename(entry.rstrip('/')) == child for entry in entries)
                  print(f'Parent directory {parent} is accessible; target entry present: {exists}.', flush=True)
                  raise
              count = sum(1 for _ in ftp.nlst())
              print(f'PASS: target directory can be listed ({count} entries).', flush=True)
              print('No files uploaded, changed, or deleted.', flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('FTPS certificate, login, and target directory listing passed.\n\n')
                  summary.write('This read-only check does not verify write permissions or publish the site.\n')
          except (OSError, ftplib.Error) as exc:
              sys.exit(f'FAIL at {stage}: {exc}')
          finally:
              ftp.close()
          PY
